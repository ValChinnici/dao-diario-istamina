<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background for optimal contrast/testing (Remove if strictly transparent background is required) -->
  <defs>
    <style>
      .icon-stroke {
        fill: none;
        stroke: #0EA5E9;
        stroke-width: 24;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .icon-fill {
        fill: #0EA5E9;
        stroke: none;
      }
    </style>
  </defs>

  <g transform="translate(0, 0)">
    <!-- Outer Biological Hexagon (Thick, Bold Bounds) -->
    <polygon points="256,32 440,138 440,350 256,456 72,350 72,138" class="icon-stroke" stroke-width="28" />

    <!-- Center Plate (Outer Ring) -->
    <circle cx="256" cy="244" r="110" class="icon-stroke" stroke-width="24" />

    <!-- Plate Inner Rim -->
    <circle cx="256" cy="244" r="70" class="icon-stroke" stroke-width="14" opacity="0.6" />

    <!-- Bold Protection / Low-Histamine Verified Checkmark -->
    <polyline points="216,244 246,274 306,214" class="icon-stroke" stroke-width="28" />
  </g>
</svg>
